name: accessnav_flutter
description: "AccessNav Android WebView application."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  flutter_tts: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/poi.json
    - assets/web/
    - assets/web/images/
